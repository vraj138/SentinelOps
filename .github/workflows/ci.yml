name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Test
        # The suite needs no Docker, network or API keys: tool servers, the agent and the
        # control plane are tested with fakes and in-process MCP servers.
        run: make test
