groups:
  - name: demo-services
    rules:
      - alert: ServiceDown
        expr: up{job="demo"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}."

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / sum by (service) (rate(http_requests_total[1m]))
            > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 5xx rate is {{ $value | humanizePercentage }}"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[1m]))
          ) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p95 latency is {{ $value | humanizeDuration }}"
