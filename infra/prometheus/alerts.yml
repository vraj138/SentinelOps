groups:
  - name: demo-services
    rules:
      - alert: ServiceDown
        expr: up{job="demo"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}."

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / sum by (service) (rate(http_requests_total[1m]))
            > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 5xx rate is {{ $value | humanizePercentage }}"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[1m]))
          ) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p95 latency is {{ $value | humanizeDuration }}"

      - alert: HighMemoryUsage
        # Demo containers have a 128 MiB limit; 100 MiB leaves little headroom.
        expr: process_resident_memory_bytes{job="demo"} > 100 * 1024 * 1024
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is using {{ $value | humanize1024 }}B of memory"

      - alert: FrequentRestarts
        # app_start_time_seconds changes on every restart. A deploy plus a rollback is two;
        # three or more in 15 minutes means the service keeps crashing (e.g. OOM kills).
        # (process_start_time_seconds is not used: it is derived from the VM boot time and
        # jumps when the VM clock is corrected, which looks like a restart.)
        expr: changes(app_start_time_seconds{job="demo"}[15m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} restarted {{ $value }} times in the last 15 minutes"
