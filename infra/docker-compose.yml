# SentinelOps demo stack: gateway -> orders -> payments, plus Postgres and Prometheus.
# Start with `make up` (tags the image with the current git commit), stop with `make down`.
# Release settings come from the deploy repo in storage/deploy-repo (see faults/deploy_repo.py).
name: sentinelops

x-demo-service: &demo-service
  build:
    context: ..
    dockerfile: demo_app/Dockerfile
  image: sentinelops-demo:${IMAGE_TAG:-dev}
  restart: unless-stopped
  mem_limit: 128m
  memswap_limit: 128m  # no swap: a leak ends in an OOM kill, like on a real server
  volumes:
    - ../storage/flags:/flags:ro
  environment: &demo-env
    ORDERS_URL: http://orders:8000
    PAYMENTS_URL: http://payments:8000
    GATEWAY_URL: http://gateway:8000
    DATABASE_URL: postgresql://orders_app:orders_app@postgres:5432/sentinelops
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  gateway:
    <<: *demo-service
    command: ["uvicorn", "demo_app.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../storage/deploy-repo/services/gateway.env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      orders: {condition: service_healthy}

  orders:
    <<: *demo-service
    command: ["uvicorn", "demo_app.orders:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../storage/deploy-repo/services/orders.env
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      payments: {condition: service_healthy}

  payments:
    <<: *demo-service
    command: ["uvicorn", "demo_app.payments:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../storage/deploy-repo/services/payments.env
    volumes:
      - ../storage/flags:/flags:ro
      - ../storage/provider:/provider:ro
    ports: ["127.0.0.1:8002:8000"]

  loadgen:
    <<: *demo-service
    command: ["python", "-m", "demo_app.loadgen"]
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      <<: *demo-env
      LOADGEN_RPS: "3"
    healthcheck:
      disable: true
    depends_on:
      gateway: {condition: service_healthy}

  event-recorder:
    # Docker keeps only its last 256 events, and health checks flood them within a minute.
    # This records container lifecycle events (not health checks) so crashes and OOM kills
    # are still visible when someone investigates later.
    image: docker:27-cli
    restart: unless-stopped
    mem_limit: 48m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../storage/events:/events
    command:
      - sh
      - -c
      - >-
        docker events --format '{{json .}}' --filter type=container
        --filter event=create --filter event=start --filter event=restart --filter event=die
        --filter event=oom --filter event=kill --filter event=stop --filter event=destroy
        >> /events/containers.jsonl

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=40"]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: sentinelops
      POSTGRES_DB: sentinelops
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sentinelops", "-d", "sentinelops"]
      interval: 5s
      timeout: 3s
      retries: 10

  controlplane-db:
    # SentinelOps' own state (incidents, approvals). Separate from the demo Postgres, which
    # the DB-exhaustion fault fills: the control plane must keep working during that incident.
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: sentinelops
      POSTGRES_DB: sentinelops
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - controlplane-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sentinelops", "-d", "sentinelops"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: [gateway, orders, payments]

volumes:
  postgres-data:
  controlplane-data:
